name: Keepalive

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keepalive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping TrackED health endpoint
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            --retry 3 --retry-delay 10 --max-time 30 \
            https://tracked-liooouu-dev.apps.rm2.thpm.p1.openshiftapps.com/api/health
